# Запуск: docker compose up -d --build
services:
  app:
    build: .
    container_name: helpdesk
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/requests.db
    ports:
      - "${APP_PORT:-80}:5000"
    volumes:
      - helpdesk-data:/data   # база переживает пересборку и перезапуск контейнера

volumes:
  helpdesk-data:
