<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#000" stroke-width="1.2"/></marker></defs><rect width="1500" height="1250" fill="#fff"/><text x="750.0" y="38.3" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">Диаграмма компонентов: система учёта заявок HelpDesk</text><rect x="595" y="60" width="190" height="62" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="690.0" y="87.1" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Веб-браузер</text><text x="690.0" y="104.0" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">пользователь работает с сайтом</text><rect x="800" y="60" width="190" height="62" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="895.0" y="87.1" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">API-клиент</text><text x="895.0" y="104.0" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">curl, Postman, скрипты</text><rect x="1005" y="60" width="190" height="62" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1100.0" y="87.1" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Swagger UI</text><text x="1100.0" y="104.0" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">документация и проба API (/docs)</text><rect x="330" y="150" width="1130" height="1050" rx="0" fill="#fff" stroke="#000" stroke-width="1.8" stroke-dasharray="7 5"/><text x="345" y="1187.9" font-size="14" text-anchor="start" font-weight="bold" font-style="normal" fill="#000">Docker-контейнер (Python 3.12, сервер waitress), порт 5000 → 80 на хосте</text><rect x="360" y="190" width="1070" height="960" rx="0" fill="#fff" stroke="#000" stroke-width="1.8"/><text x="375" y="1136.9" font-size="14" text-anchor="start" font-weight="bold" font-style="normal" fill="#000">Приложение Flask  (app.py: create_app, обработчики ошибок, /health, /docs)</text><rect x="375" y="225" width="1045" height="215" rx="0" fill="#f6f6f6" stroke="#000" stroke-width="1"/><text x="387" y="245.2" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#000">Слой представления (Presentation)</text><rect x="375" y="460" width="1045" height="130" rx="0" fill="#f6f6f6" stroke="#000" stroke-width="1"/><text x="387" y="480.2" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#000">Слой сервисов (Service)</text><rect x="375" y="610" width="1045" height="135" rx="0" fill="#f6f6f6" stroke="#000" stroke-width="1"/><text x="387" y="630.2" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#000">Слой доступа к данным (Repository)</text><rect x="375" y="765" width="1045" height="135" rx="0" fill="#f6f6f6" stroke="#000" stroke-width="1"/><text x="387" y="785.2" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#000">Слой базы данных (Database)</text><rect x="375" y="920" width="1045" height="180" rx="0" fill="#f6f6f6" stroke="#000" stroke-width="1"/><text x="387" y="940.2" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#000">Общие модули</text><rect x="390" y="255" width="190" height="110" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="485.0" y="279.9" font-size="14" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">templates/ + static/</text><text x="485.0" y="319.4" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">HTML-шаблоны,</text><text x="485.0" y="335.0" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">стили (Jinja2)</text><rect x="595" y="255" width="190" height="110" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="690.0" y="279.9" font-size="14" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">web.py</text><text x="690.0" y="311.59999999999997" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Контроллеры веб-</text><text x="690.0" y="327.2" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">интерфейса: вход, список,</text><text x="690.0" y="342.79999999999995" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">карточка, формы</text><rect x="800" y="255" width="190" height="110" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="895.0" y="279.9" font-size="14" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">api.py</text><text x="895.0" y="311.59999999999997" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Контроллеры REST API</text><text x="895.0" y="327.2" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">/api/requests, /api/users,</text><text x="895.0" y="342.79999999999995" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">/api/statuses, ...</text><rect x="1005" y="255" width="190" height="110" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1100.0" y="279.9" font-size="14" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">openapi.py</text><text x="1100.0" y="311.59999999999997" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Описание API</text><text x="1100.0" y="327.2" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">(OpenAPI) для</text><text x="1100.0" y="342.79999999999995" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Swagger UI</text><rect x="1210" y="255" width="190" height="110" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1305.0" y="279.9" font-size="14" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">auth.py</text><text x="1305.0" y="311.59999999999997" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Вход, сессия (веб),</text><text x="1305.0" y="327.2" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">HTTP Basic (API);</text><text x="1305.0" y="342.79999999999995" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">используется web и api</text><rect x="390" y="495" width="1010" height="75" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="895" y="519.9" font-size="14" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">services.py</text><text x="895" y="549.2" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Бизнес-правила: проверка ввода, права ролей, правила смены статусов, назначение исполнителя, история</text><rect x="520" y="645" width="350" height="75" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="695" y="669.9" font-size="14" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">repositories.py</text><text x="695" y="699.2" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Все SQL-запросы (CRUD), без бизнес-решений</text><rect x="920" y="645" width="350" height="75" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1095" y="669.9" font-size="14" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">db.py</text><text x="1095" y="699.2" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Подключение к SQLite, создание БД при запуске</text><rect x="520" y="795" width="350" height="80" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="695" y="819.9" font-size="14" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">db/schema.sql, db/seed.sql</text><text x="695" y="843.4000000000001" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Создание таблиц и тестовые данные</text><text x="695" y="859.0000000000001" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">(выполняются при первом запуске)</text><rect x="920" y="795" width="350" height="80" rx="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1095" y="819.9" font-size="14" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">requests.db (SQLite)</text><text x="1095" y="843.4000000000001" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Users, Requests, Statuses, Categories,</text><text x="1095" y="859.0000000000001" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Comments, RequestHistory; том /data</text><rect x="390" y="955" width="480" height="105" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="630" y="979.9" font-size="14" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">config.py</text><text x="630" y="1003.6" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Настройки из переменных окружения (.env):</text><text x="630" y="1019.2" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">SECRET_KEY, DATABASE_PATH, HOST, PORT,</text><text x="630" y="1034.8" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">FLASK_DEBUG; используется при создании приложения</text><rect x="920" y="955" width="480" height="105" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1160" y="979.9" font-size="14" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">errors.py</text><text x="1160" y="1003.6" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Ошибки приложения и их HTTP-коды</text><text x="1160" y="1019.2" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">(400, 403, 404, 415, 422);</text><text x="1160" y="1034.8" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">единый формат ответа об ошибке</text><line x1="690" y1="122" x2="690" y2="255" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/><text x="700" y="144.2" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">HTTP, HTML</text><line x1="895" y1="122" x2="895" y2="255" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/><text x="905" y="144.2" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">HTTP, JSON (Basic)</text><line x1="1100" y1="122" x2="1100" y2="255" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/><text x="1110" y="144.2" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">GET /docs</text><line x1="595" y1="310" x2="580" y2="310" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/><line x1="595" y1="310" x2="580" y2="310" stroke="#000" stroke-width="1.4"/><polyline points="595,310 580,310" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/><line x1="690" y1="365" x2="690" y2="495" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/><line x1="895" y1="365" x2="895" y2="495" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/><text x="700" y="459.2" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">вызов</text><line x1="695" y1="570" x2="695" y2="645" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/><text x="705" y="616.2" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">запросы к данным</text><line x1="870" y1="682" x2="920" y2="682" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/><line x1="1095" y1="720" x2="1095" y2="795" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/><text x="1105" y="764.2" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">SQL</text><line x1="870" y1="835" x2="920" y2="835" stroke="#000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="895" y="925.35" font-size="1" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000"></text><text x="895" y="1232.2" font-size="12" text-anchor="middle" font-weight="normal" font-style="italic" fill="#000">Контроллеры не содержат SQL, сервисы не формируют HTML, репозитории не принимают бизнес-решений.</text></svg>